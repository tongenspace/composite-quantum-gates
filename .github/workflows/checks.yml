name: Reproduction checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-static.txt
      - run: python reproduce.py verify
      - run: python reproduce.py check
      - run: python reproduce.py scorbutus
      - run: python design/check_controls.py
      - run: python reproduce.py grid-convergence
